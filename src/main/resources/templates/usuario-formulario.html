<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Agregar Usuario - KinalApp</title>
    <link rel="icon" type="image/png" href="/images/logoapp.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div sec:authorize="hasRole('ADMIN')">
    <main class="main-small">
        <header>
            <div class="header-logo">
                <img src="/images/logoapp.png" alt="KinalApp Logo" class="logo-img">
                <div class="header-content">
                    <h1>Agregar Usuario</h1>
                    <p>Complete los datos del nuevo usuario</p>
                </div>
            </div>
            <nav>
                <a href="/usuarios/lista" class="button">← Volver a Usuarios</a>
            </nav>
        </header>

        <div th:if="${error}" class="mensaje-error" th:text="${error}"></div>

        <section>
            <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="username">Nombre de Usuario *</label>
                    <input type="text" id="username" name="username" th:field="*{username}" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico *</label>
                    <input type="email" id="email" name="email" th:field="*{email}"
                           pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$"
                           title="Ingresa un correo válido (ejemplo: usuario@correo.com)" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="rol">Rol *</label>
                    <select id="rol" name="rol" required>
                        <option value="USER">Usuario</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="estado">Estado *</label>
                    <select id="estado" name="estado" required>
                        <option value="1">Activo</option>
                        <option value="0">Inactivo</option>
                    </select>
                </div>

                <button type="submit">Guardar Usuario</button>

                <nav style="margin-top: 10px;">
                    <a href="/usuarios/lista" style="background: #6c757d;">Cancelar</a>
                </nav>
            </form>
        </section>

        <footer>
            <img src="/images/logoapp.png" alt="KinalApp" class="footer-logo">
            <p>KinalApp - Sistema de Gestión de Ventas © 2024</p>
        </footer>
    </main>
</div>
<div sec:authorize="!hasRole('ADMIN')">
    <main class="main-small">
        <header>
            <h1>Acceso Denegado</h1>
            <p>No tienes permisos para ver esta página</p>
        </header>
        <nav style="text-align: center; padding: 20px;">
            <a href="/inicio" class="button">Volver al Inicio</a>
        </nav>
    </main>
</div>
</body>
</html>

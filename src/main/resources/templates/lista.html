<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Lista de Productos - KinalApp</title>
    <link rel="icon" type="image/png" href="/images/logoapp.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="main-large">
    <header>
        <div class="header-logo">
            <img src="/images/logoapp.png" alt="KinalApp Logo" class="logo-img">
            <div class="header-content">
                <h1>Lista de Productos</h1>
                <p>Acá se encuentran los productos registrados</p>
            </div>
        </div>
        <nav>
            <a href="/inicio" class="button">← Volver al Inicio</a>
        </nav>
    </header>

    <div th:if="${mensaje}" class="mensaje-exito" th:text="${mensaje}"></div>
    <div th:if="${error}" class="mensaje-error" th:text="${error}"></div>

    <div class="tabla-container">
        <div style="margin-bottom: 20px;">
            <a sec:authorize="hasRole('ADMIN')" href="/producto/nuevo" class="button" style="background: #28a745;">+ Agregar Producto</a>
        </div>

        <table>
            <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>
                <th sec:authorize="hasRole('ADMIN')">Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="producto : ${productos}">
                <td th:text="${producto.codigo_producto}"></td>
                <td th:text="${producto.nombre_producto}"></td>
                <td class="precio" th:text="'Q' + ${#numbers.formatDecimal(producto.precio, 1, 2)}"></td>
                <td th:text="${producto.stock}"></td>
                <td>
                    <span th:if="${producto.estado == 1}" class="estado-activo">Activo</span>
                    <span th:if="${producto.estado == 0}" class="estado-inactivo">Inactivo</span>
                </td>
                <td sec:authorize="hasRole('ADMIN')" class="acciones">
                    <a th:href="@{/producto/editar/{id}(id=${new com.carlosxocop.kinalapp.util.JwtIdEncryptor().encryptId(producto.codigo_producto)})}"
                       class="btn-editar"
                       style="text-decoration: none; display: inline-block;">
                        Editar
                    </a>
                    <form th:action="@{/producto/eliminar/{id}(id=${new com.carlosxocop.kinalapp.util.JwtIdEncryptor().encryptId(producto.codigo_producto)})}"
                          method="post"
                          style="display: inline;">
                        <button type="submit" class="btn-eliminar"
                                onclick="return confirm('¿Estás seguro de desactivar este producto?')">
                            Eliminar
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${productos.isEmpty()}">
                <td colspan="6" class="vacio">
                    No hay productos registrados
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <footer>
        <img src="/images/logoapp.png" alt="KinalApp" class="footer-logo">
        <p>KinalApp - Sistema de Gestión de Ventas © 2024</p>
        <p style="font-size: 11px; margin-top: 5px;">Versión 1.0 | Todos los derechos reservados</p>
    </footer>
</main>
</body>
</html>
